<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-labelledby="idea-title idea-description">
<title id="idea-title">One key opens every secret</title>
<desc id="idea-description">One key, kept in a password manager, opens every encrypted file in the repository, one per environment. With the key, you, your teammates, and CI read every value; without it, a fork, a leak, or an old commit shows only the secret names.</desc>
