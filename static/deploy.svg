<text x="122" y="47.5" fill="var(--muted)" font-size="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">YOUR REPOSITORY AND CI</text>
<rect x="392" y="44" width="352" height="260" rx="8" fill="var(--zone)" stroke="var(--line)"/>
<rect x="408" y="36" width="172" height="16" fill="var(--paper)"/>
<text x="494" y="47.5" fill="var(--muted)" font-size="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">YOUR HOSTING PLATFORM</text>
<path d="M 188,100 H 276 Q 284,100 284,108 V 140" fill="none" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 188,256 H 276 Q 284,256 284,248 V 232" fill="none" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 352,186 H 408" fill="none" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)"/>
