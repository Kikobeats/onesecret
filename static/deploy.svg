<path d="M 320,140 V 24 Q 320,16 328,16 H 652 Q 660,16 660,24 V 140" fill="none" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="190" y="78" width="92" height="16" rx="2" fill="var(--paper)"/>
<text x="236" y="90" fill="var(--muted)" font-size="11" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">CIPHERTEXT</text>
<rect x="202" y="234" width="68" height="16" rx="2" fill="var(--paper)"/>
<text x="236" y="246" fill="var(--muted)" font-size="11" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">AGE KEY</text>
<rect x="350" y="164" width="60" height="16" rx="2" fill="var(--paper)"/>
<text x="380" y="176" fill="var(--muted)" font-size="11" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">VALUES</text>
<rect x="378" y="8" width="224" height="16" rx="2" fill="var(--paper)"/>
<text x="490" y="20" fill="var(--muted)" font-size="11" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">SHIPS config/, NEVER THE KEY</text>
<rect x="32" y="64" width="156" height="72" rx="6" fill="var(--paper)"/>
<rect x="32" y="64" width="156" height="72" rx="6" fill="var(--store)" stroke="var(--muted)"/>
<rect x="40" y="72" width="44" height="16" rx="2" fill="none" stroke="var(--muted)" stroke-width="0.8"/>
<text x="62" y="83.5" fill="var(--muted)" font-size="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
<text x="110" y="105.5" fill="var(--ink)" font-size="16" font-weight="600" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">config/</text>
<text x="110" y="122.5" fill="var(--muted)" font-size="12" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">*.enc.yml, encrypted</text>
<rect x="32" y="220" width="156" height="72" rx="6" fill="var(--paper)"/>
<rect x="32" y="220" width="156" height="72" rx="6" fill="var(--accentFill)" stroke="var(--accent)" stroke-dasharray="4,4"/>
<rect x="40" y="228" width="36" height="16" rx="2" fill="none" stroke="var(--accent)" stroke-width="0.8"/>
<text x="58" y="239.5" fill="var(--accent)" font-size="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">KEY</text>
<text x="110" y="261.5" fill="var(--ink)" font-size="16" font-weight="600" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">SOPS_AGE_KEY</text>
<text x="110" y="278.5" fill="var(--muted)" font-size="12" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">a CI variable</text>
<rect x="216" y="140" width="136" height="92" rx="6" fill="var(--paper)"/>
<rect x="216" y="140" width="136" height="92" rx="6" fill="var(--accentFill)" stroke="var(--accent)"/>
<rect x="224" y="148" width="84" height="16" rx="2" fill="none" stroke="var(--accent)" stroke-width="0.8"/>
<text x="266" y="159.5" fill="var(--accent)" font-size="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">DEPLOY JOB</text>
<text x="284" y="184" fill="var(--ink)" font-size="16" font-weight="600" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">deploy script</text>
<text x="284" y="201" fill="var(--muted)" font-size="12" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">onesecret dotenv</text>
<text x="284" y="216" fill="var(--muted)" font-size="12" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">values in memory</text>
<rect x="408" y="140" width="136" height="92" rx="6" fill="var(--paper)"/>
<rect x="408" y="140" width="136" height="92" rx="6" fill="var(--store)" stroke="var(--line)"/>
<rect x="416" y="148" width="64" height="16" rx="2" fill="none" stroke="var(--muted)" stroke-width="0.8"/>
<text x="448" y="159.5" fill="var(--muted)" font-size="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">SECRETS</text>
<text x="476" y="184" fill="var(--ink)" font-size="16" font-weight="600" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Platform</text>
<text x="476" y="201" fill="var(--muted)" font-size="12" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Vercel, Fly.io,</text>
<text x="476" y="216" fill="var(--muted)" font-size="12" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">AWS, and more</text>
<rect x="592" y="140" width="136" height="92" rx="6" fill="var(--paper)"/>
<rect x="592" y="140" width="136" height="92" rx="6" fill="var(--app)" stroke="var(--ink)"/>
<rect x="600" y="148" width="36" height="16" rx="2" fill="none" stroke="var(--ink)" stroke-width="0.8"/>
<text x="618" y="159.5" fill="var(--ink)" font-size="10" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
<text x="660" y="184" fill="var(--ink)" font-size="16" font-weight="600" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">your app</text>
<text x="660" y="201" fill="var(--muted)" font-size="12" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">config() at boot</text>
<text x="660" y="216" fill="var(--muted)" font-size="12" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">decrypts nothing</text>
<text x="408" y="264" fill="var(--ink)" font-size="15" font-style="italic" font-family="Georgia, 'Times New Roman', serif">The key never reaches your servers: the app</text>
<text x="408" y="284" fill="var(--ink)" font-size="15" font-style="italic" font-family="Georgia, 'Times New Roman', serif">finds every secret already set at boot.</text>
