<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; }
    body {
      background: #0f110f;
      color: #ebe9e2;
      font-family: 'IBM Plex Sans', sans-serif;
      height: 630px;
      width: 1200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 96px;
      box-sizing: border-box;
      background-image: radial-gradient(circle at 85% 20%, rgb(61 220 151 / 0.16), transparent 45%);
    }
    .brand { display: flex; align-items: center; gap: 28px; }
    .brand img { width: 104px; height: 104px; }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: 108px; letter-spacing: -0.04em; margin: 0; }
    p { font-size: 40px; color: #a8a59b; margin: 40px 0 0; max-width: 900px; line-height: 1.3; }
    p strong { color: #ebe9e2; font-weight: 400; }
    code { display: inline-block; margin-top: 56px; font-family: 'JetBrains Mono', monospace; font-size: 30px; color: #3ddc97; border: 1px solid #292d29; background: #171a17; border-radius: 14px; padding: 14px 24px; align-self: flex-start; }
  </style>
</head>
<body>
  <div class="brand"><img src="../static/logo.svg" alt="" /><h1>onesecret</h1></div>
  <p><strong>Keep just one secret to decrypt the rest.</strong> SOPS + age secrets for Node.js, with no binaries to install.</p>
  <code>$ npm install onesecret</code>
</body>
</html>
